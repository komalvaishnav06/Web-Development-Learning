<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee tag</title>
</head>
<body>
    <div align="right">
    <marquee behavior="" bgcolor="red" width="1000px" height="100px" direction="right">Hey whasupp!!</marquee>
    <marquee behavior="slide" bgcolor="yellow" width="1000px" height="100px" direction="left">Hey whasupp i'm slide!!</marquee>
    <marquee behavior="alternate" bgcolor="pink" width="1000px" height="100px" direction="up">Hey whasupp i'm alternate!!</marquee>
    <marquee behavior="alternate" bgcolor="skyblue" width="1000px" height="100px" direction="down">Hey whasupp i'm alternate!!</marquee>
    <!-- <marquee behavior="" direction="">Hey whasupp!!</marquee> -->
    </div>
</body>
</html>
